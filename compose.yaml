name: alfa-tg-botik

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: assistant
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dockerfiles/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "assistant"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    image: alfa-tg-botik-backend:local
    build:
      context: .
      dockerfile: dockerfiles/backend/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MINI_APP_URL: ${TELEGRAM_MINI_APP_URL:-}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen3.5:9b-q4_K_M}
      ASSISTANT_MODEL_REVISION: ${ASSISTANT_MODEL_REVISION:-56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90}
    volumes:
      - ./data/processed:/data/processed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    image: alfa-tg-botik-frontend:local
    build:
      context: .
      dockerfile: dockerfiles/frontend/Dockerfile
      args:
        VITE_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-alfa_business_helper_bot}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
