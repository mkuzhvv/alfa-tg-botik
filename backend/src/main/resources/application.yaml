spring:
  application:
    name: alfa-tg-botik
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/assistant?currentSchema=app,knowledge,public
    username: postgres
  flyway:
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
