spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: alfa-tg-botik
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/assistant?currentSchema=app,knowledge,public
    username: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
  sql:
    init:
      mode: never

telegram:
  enabled: ${TELEGRAM_BOT_ENABLED:false}
  token: ${TELEGRAM_BOT_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
