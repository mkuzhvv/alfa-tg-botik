spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: alfa-tg-botik
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/assistant?currentSchema=app,knowledge,public
    username: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
  sql:
    init:
      mode: never
  quartz:
    job-store-type: jdbc
    auto-startup: false
    wait-for-jobs-to-complete-on-shutdown: true
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: alfa-reminders
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: app.qrtz_
      org.quartz.threadPool.threadCount: 2

telegram:
  enabled: ${TELEGRAM_BOT_ENABLED:false}
  token: ${TELEGRAM_BOT_TOKEN:}

knowledge:
  ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
